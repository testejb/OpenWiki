wiki_root = "/absolute/path/to/wiki-root"
domain = "<user domain description>"

[wiki]
primary_language = "zh"
secondary_language = "en"

[wiki.source_types]
types = ["papers", "urls"]

[wiki.index]
layout = "layered"
routing_index = "wiki/index.md"
shards = [
  "wiki/indexes/scopes.md",
  "wiki/indexes/entities.md",
  "wiki/indexes/concepts.md",
  "wiki/indexes/tags.md",
  "wiki/indexes/recent.md",
  "wiki/indexes/hot.md",
]
query_usage = "wiki/indexes/query-usage.jsonl"

[remote]
sync_path = "wiki"
auto_sync = false
